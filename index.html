<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Friendship Day ❤️</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Pacifico&display=swap" rel="stylesheet">

</head>
<!-- Background Music -->
<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- Music Button -->
<button id="musicBtn">🎵 Play Music</button>

<!-- Mouse Glow -->
<div id="cursorGlow"></div>
<body>

<!-- Loading Screen -->
<div id="loader">
<div class="loader-heart">❤️</div>
<p>Preparing something special...</p>
</div>

<!-- Floating Hearts -->
<div id="hearts"></div>

<!-- Main Container -->

<section id="main">

<div class="glass">

<h1 class="title">
Happy Friendship Day
</h1>

<h2 class="name">
megna🌸
</h2>

<!-- Slideshow -->

<div class="slider">

<img src="1.jpg" class="slide active">
<img src="2.jpg" class="slide">
<img src="3.jpg" class="slide">

</div>

<!-- Typewriter -->

<p id="typing"></p>

<!-- Gift Button -->

<button id="giftBtn">

🎁 Open Your Surprise

</button>

</div>

</section>

<!-- Surprise Popup -->

<div id="popup">

<div class="popup-card">

<h2>💖 Surprise 💖</h2>

<p>

Thank you for being my best friend.

You make every moment brighter,
every laugh louder,
and every memory unforgettable.

No matter where life takes us,
our friendship will always stay special.

✨ Happy Friendship Day ✨

</p>

<button id="closeBtn">

❤️ Best Friends Forever ❤️

</button>

</div>

</div>

<!-- Canvas for Fireworks -->

<canvas id="canvas"></canvas>

<script src="script.js"></script>

</body>
</html>
